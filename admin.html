<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MetroDrive Admin</title><style>*{box-sizing:border-box}body{background:#101c30;color:#fff;font:16px Arial;margin:0;padding:30px}main{max-width:560px;margin:8vh auto;background:#203149;padding:32px;border-radius:20px}h1{color:#ffcc22}input,textarea,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #64748b;font:inherit}input,textarea{background:#101c30;color:white}button{background:#ffcc22;color:#101c30;font-weight:bold;cursor:pointer}label{display:block}small{color:#cbd5e1}</style><main><h1>MetroDrive Admin</h1><p>Global announcements · George</p><form id="send"><label>Announcement<textarea id="message" maxlength="240" rows="4" required></textarea></label><small>Displayed as George: your message</small><button>Broadcast to all players</button><hr><h2>Server controls</h2><p id="players">Online players: —</p><button type="button" id="count">Refresh online players</button><button type="button" id="george" style="background:#a78bfa">Start George Event · 2 minutes</button><button type="button" id="rich" style="background:#e8c46a">Start Billionaire Event · 2 minutes</button><hr><h2>Weather control</h2><label>Weather type<select id="stormType" style="width:100%;padding:12px;margin:8px 0;background:#101c30;color:white;border:1px solid #64748b;border-radius:8px"><option value="random">Random weather</option><option value="Rain">Rain</option><option value="Thunderstorm">Thunderstorm</option><option value="Sandstorm">Sandstorm</option><option value="Cyclone">Extreme cyclone</option></select></label><label>Intensity<select id="stormPower" style="width:100%;padding:12px;margin:8px 0;background:#101c30;color:white;border:1px solid #64748b;border-radius:8px"><option value="random">Random</option><option value="1">Green · Light</option><option value="2">Yellow · Moderate</option><option value="3">Orange · Heavy</option><option value="4">Red · Near-dangerous</option><option value="5">Purple · Extreme cyclone</option></select></label><label>Duration<select id="stormDuration" style="width:100%;padding:12px;margin:8px 0;background:#101c30;color:white;border:1px solid #64748b;border-radius:8px"><option value="120">2 minutes</option><option value="240">4 minutes</option><option value="360">6 minutes</option></select></label><small>Random position and direction across the entire map. Purple intensity creates an extreme cyclone regardless of selected type.</small><button type="button" id="spawnStorm" style="background:#60a5fa">Start random-location storm</button><button type="button" id="clearStorm" style="background:#cbd5e1">Clear manually started storms</button><hr><button type="button" id="update">Update All Players</button></form><p id="status" role="status"></p></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const sb=createClient('https://pzxupuryrjgbboldfrna.supabase.co','sb_publishable_DfP264XeZ6SIO2zlyLZOVg_HtMk0a_h',{auth:{persistSession:false,storageKey:'taxi-public-console'}});const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;$('send').onsubmit=async e=>{e.preventDefault();let message=$('message').value.trim();if(!message)return;let {error}=await sb.from('taxi_announcements').insert({message});status(error?'Message not sent. Wait 1 second and try again.':'Announcement sent');if(!error)$('message').value='';};let presence;async function openAdmin(){status('Connected');if(!presence){presence=sb.channel('taxi:city:v1',{config:{private:true}}).on('presence',{event:'sync'},refreshCount).subscribe(state=>{if(state==='SUBSCRIBED')refreshCount();else $('players').textContent='Online players: connection '+state;});}}function refreshCount(){if(!presence)return;$('players').textContent='Online game sessions: '+Object.keys(presence.presenceState()).length;}$('count').onclick=refreshCount;$('update').onclick=async()=>{if(!confirm('Ask all connected players to check for the latest published version?'))return;let {error}=await sb.from('taxi_announcements').insert({kind:'update',message:'Check for update'});status(error?'Update request failed. Wait 1 second and try again.':'Update check requested for all players');};$('george').onclick=async()=>{if(!confirm('Start the George UFO event for all players?'))return;let {error}=await sb.from('taxi_announcements').insert({kind:'george',message:'George Event'});status(error?'Event not started. Wait 1 second.':'George Event started');};$('rich').onclick=async()=>{if(!confirm('Start Billionaire Event?'))return;let {error}=await sb.from('taxi_announcements').insert({kind:'message',message:'[BILLIONAIRE_EVENT_V1]'});status(error?'Event not started. Wait 1 second.':'Billionaire Event started');};async function weatherCommand(payload){let button=$('spawnStorm');button.disabled=true;try{let {error}=await sb.from('taxi_announcements').insert({kind:'message',message:'[WEATHER_V1]'+JSON.stringify(payload)});status(error?'Weather request failed: '+error.message:'Weather request sent to all players');}catch(e){status('Weather request failed');}finally{button.disabled=false;}}
$('stormType').onchange=()=>{$('stormPower').disabled=$('stormType').value==='Cyclone';};
$('spawnStorm').onclick=()=>weatherCommand({action:'spawn',kind:$('stormType').value,band:$('stormPower').value,duration:Number($('stormDuration').value)});
$('clearStorm').onclick=()=>{if(confirm('Clear manually started storms for all players?'))weatherCommand({action:'clear'});};openAdmin();</script></html>
