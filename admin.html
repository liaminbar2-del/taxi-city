atus('Connected');};$('send').onsubmit=async e=>{e.preventDefault();let message=$('message').value.trim();if(!message)return;let {error}=await sb.from('taxi_announcements').insert({message});status(error?'Message not sent':'Announcement sent');if(!error)$('message').value='';};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};</script></html>
