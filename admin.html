<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taxi City Admin</title><style>*{box-sizing:border-box}body{background:#101c30;color:#fff;font:16px Arial;margin:0;padding:30px}main{max-width:560px;margin:8vh auto;background:#203149;padding:32px;border-radius:20px}h1{color:#ffcc22}input,textarea,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #64748b;font:inherit}input,textarea{background:#101c30;color:white}button{background:#ffcc22;color:#101c30;font-weight:bold;cursor:pointer}label{display:block}small{color:#cbd5e1}</style><main><h1>Taxi City Admin</h1><p>Global announcements · George</p><form id="send"><label>Announcement<textarea id="message" maxlength="240" rows="4" required></textarea></label><small>Displayed as George: your message</small><button>Broadcast to all players</button><hr><h2>Server controls</h2><p id="players">Online players: —</p><button type="button" id="count">Refresh online players</button><button type="button" id="george" style="background:#a78bfa">Start George Event · 2 minutes</button><button type="button" id="rich" style="background:#e8c46a">Start Billionaire Event · 2 minutes</button><button type="button" id="update">Update All Players</button></form><p id="status" role="status"></p></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';const sb=createClient('https://pzxupuryrjgbboldfrna.supabase.co','sb_publishable_DfP264XeZ6SIO2zlyLZOVg_HtMk0a_h',{auth:{persistSession:false,storageKey:'taxi-public-console'}});const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;$('send').onsubmit=async e=>{e.preventDefault();let message=$('message').value.trim();if(!message)return;let {error}=await sb.from('taxi_announcements').insert({message});status(error?'Message not sent. Wait 15 seconds and try again.':'Announcement sent');if(!error)$('message').value='';};let presence;async function openAdmin(){status('Connected');if(!presence){presence=sb.channel('taxi:city:v1',{config:{private:true}}).on('presence',{event:'sync'},refreshCount).subscribe(state=>{if(state==='SUBSCRIBED')refreshCount();else $('players').textContent='Online players: connection '+state;});}}function refreshCount(){if(!presence)return;$('players').textContent='Online game sessions: '+Object.keys(presence.presenceState()).length;}$('count').onclick=refreshCount;$('update').onclick=async()=>{if(!confirm('Ask all connected players to check for the latest published version?'))return;let {error}=await sb.from('taxi_announcements').insert({kind:'update',message:'Check for update'});status(error?'Update request failed. Wait 15 seconds and try again.':'Update check requested for all players');};$('george').onclick=async()=>{if(!confirm('Start the George UFO event for all players?'))return;let {error}=await sb.from('taxi_announcements').insert({kind:'george',message:'George Event'});status(error?'Event not started. Wait 15 seconds.':'George Event started');};$('rich').onclick=async()=>{if(!confirm('Start Billionaire Event?'))return;let {error}=await sb.from('taxi_announcements').insert({kind:'message',message:'[BILLIONAIRE_EVENT_V1]'});status(error?'Event not started. Wait 15 seconds.':'Billionaire Event started');};openAdmin();</script></html>
