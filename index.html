function refreshDeviceStatus(){let p=controller(),base=matchMedia('(any-pointer:coarse)').matches?'Phone / tablet':'Desktop / laptop',extra=p?(p.mapping==='standard'?' · Gamepad detected':' · Wheel detected'):'';$('deviceStatus').textContent='Device: '+base+extra;}

function vrReversePressed(){return Array.from(renderer.xr.getSession()?.inputSources||[]).some(source=>source.handedness==='right'&&source.gamepad?.buttons[4]?.pressed);}
