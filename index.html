function drivingFeedback(now,dt){let nearest=null,dd=Infinity;for(const e of edges){let a=dist(x,z,e);if(Math.abs(a.y-y)<5&&a.d<dd){nearest=e;dd=a.d;}}let moving=Math.abs(s)>3,onRoad=nearest&&dd<nearest.w/2+1;offTime=moving&&!onRoad&&!inParking(x,z,2)?offTime+dt:0;fastTime=moving&&onRoad&&Math.abs(s)*100/60>speedLimit(nearest)+3?fastTime+dt:0;let wrong=false;if(onRoad&&!nearest.dirt&&!nearest.parking&&dd>2&&s>3){let vx=nearest.q.x-nearest.p.x,vz=nearest.q.z-nearest.p.z,cross=vx*(z-nearest.p.z)-vz*(x-nearest.p.x),forward=-Math.sin(h)*vx-Math.cos(h)*vz;wrong=cross*forward<0&&Math.abs(forward)>Math.hypot(vx,vz)*.7;}wrongTime=wrong?wrongTime+dt:0;if(offTime>1.5){warnDrive('Return to the road',now,.10);offTime=0;}else if(wrongTime>2){warnDrive('Wrong lane! Keep to your lane',now,.10);wrongTime=0;}else if(fastTime>2){warnDrive('Speed limit exceeded',now,.10);fastTime=0;}driveWarning.style.display=now<warningUntil?'block':'none';let stars=document.getElementById('liveStars');if(stars){let n=Math.max(1,Math.round(comfort*5));stars.textContent='★'.repeat(n)+'☆'.repeat(5-n);}}

const pedestrians=[];for(const j of signals){for(const a of j.heads){const g=a.g;let red=new T.MeshBasicMaterial({color:0xff3333}),green=new T.MeshBasicMaterial({color:0x183323});for(let side of [1]){let px=side*(a.w/2+2);cyl(.12,3,0x333940,px,1.5,a.w/2+2,g);box(.8,1.25,.55,0x222222,px,3,a.w/2+2,g);for(let [m,yy] of [[red,3.3],[green,2.8]]){let o=new T.Mesh(new T.BoxGeometry(.38,.32,.59),m);o.position.set(px,yy,a.w/2+2);g.add(o);}}let person=new T.Group();g.add(person);box(.65,.85,.38,0x426fa9,0,1.15,0,person);box(.48,.48,.48,0xd8a77c,0,1.82,0,person);let legs=[box(.24,.7,.25,0x303743,-.17,.35,0,person),box(.24,.7,.25,0x303743,.17,.35,0,person)];person.position.set(-a.w/2-2,0,a.w/2+2);pedestrians.push({a,person,red,green,legs,t:0,dir:1});}}

let sb,onlineUser=null,room=null,roomConnected=false,readyOnline=false,cloudBusy=false,lastCloud='',peers=new Map(),clientId=crypto.randomUUID(),alias='Driver',onlineCount=0;
function progressOnline(){return {cash,rating,rides,discovered:[...discovered],owned:[...owned],selected:fleet.indexOf(vehicle)}}
function restoreOnline(p){cash=Number.isFinite(p?.cash)?Math.max(0,p.cash):250;rating=Number.isFinite(p?.rating)?p.rating:5;rides=Number.isFinite(p?.rides)?p.rides:0;discovered.clear();for(const n of p?.discovered||[])discovered.add(n);owned=new Set([0,...(p?.owned||[]).filter(i=>fleet[i])]);vehicle=fleet[owned.has(p?.selected)?p.selected:0];newOffers();}
async function cloudSave(){if(!readyOnline||!onlineUser||cloudBusy)return;let p=progressOnline(),serial=JSON.stringify(p);if(serial===lastCloud)return;cloudBusy=true;try{let {error}=await sb.from('taxi_saves').upsert({user_id:onlineUser.id,progress:p,updated_at:new Date().toISOString()});if(error)throw error;lastCloud=serial;}catch(e){statusOnline('Save retry pending');}finally{cloudBusy=false;}}

async function joinOnline(session){if(!session||onlineUser?.id===session.user.id)return;onlineUser=session.user;readyOnline=false;alias=String(onlineUser.user_metadata?.nickname||'Driver').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,20)||'Driver';formOnline.style.display='none';field('exitOnline').style.display='inline';statusOnline('Loading cloud save');let {data,error}=await sb.from('taxi_saves').select('progress').eq('user_id',onlineUser.id).maybeSingle();if(error){statusOnline('Cloud load failed — sign out and retry');return;}restoreOnline(data?.progress);lastCloud=data?JSON.stringify(progressOnline()):'';readyOnline=true;await sb.realtime.setAuth(session.access_token);if(room)await sb.removeChannel(room);roomConnected=false;room=sb.channel('taxi:city:v1',{config:{private:true,presence:{key:clientId}}});room.on('broadcast',{event:'drive'},({payload})=>receiveOnline(payload)).on('presence',{event:'sync'},()=>{onlineCount=Object.keys(room.presenceState()).length;statusOnline(onlineCount+' online');}).subscribe(async state=>{roomConnected=state==='SUBSCRIBED';if(roomConnected){statusOnline('Online');await room.track({id:clientId});}else statusOnline('Connection '+state);});await cloudSave();}
